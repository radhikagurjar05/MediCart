databases:
  - name: medicart-db
    databaseName: medicart
    plan: free

services:
  - type: web
    name: medicart
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn --worker-class gthread --threads 4 run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medicart-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.12
