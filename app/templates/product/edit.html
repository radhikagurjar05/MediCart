{% extends "base.html" %}

{% block title %}Edit Listing — MediCart{% endblock %}

{% block content %}
<div class="container" style="padding-top: calc(var(--navbar-height) + var(--space-8)); padding-bottom: var(--space-12);">
    <div class="page-header" style="margin-bottom: var(--space-8);">
        <h1 style="font-size: var(--text-3xl); font-weight: var(--weight-bold); margin-bottom: var(--space-2);">Edit Listing</h1>
        <p style="color: var(--text-secondary);">Update details for your item.</p>
    </div>

    <div class="card animate-fade-in" style="max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
        <div class="card-body" style="padding: var(--space-8);">
            <form method="POST" action="{{ url_for('product.edit', product_id=product.id) }}" enctype="multipart/form-data">
                
                <!-- Basic Details -->
                <div class="form-group" style="margin-bottom: var(--space-5);">
                    <label for="title" class="form-label">Listing Title <span style="color: var(--danger);">*</span></label>
                    <input type="text" id="title" name="title" class="form-input" value="{{ product.title }}" required maxlength="100">
                </div>

                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-5); margin-bottom: var(--space-5);">
                    <div class="form-group">
                        <label for="category_id" class="form-label">Category <span style="color: var(--danger);">*</span></label>
                        <select id="category_id" name="category_id" class="form-input" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="condition" class="form-label">Condition <span style="color: var(--danger);">*</span></label>
                        <select id="condition" name="condition" class="form-input" required>
                            <option value="new" {% if product.condition == 'new' %}selected{% endif %}>Brand New (Sealed)</option>
                            <option value="like_new" {% if product.condition == 'like_new' %}selected{% endif %}>Like New</option>
                            <option value="good" {% if product.condition == 'good' %}selected{% endif %}>Good</option>
                            <option value="fair" {% if product.condition == 'fair' %}selected{% endif %}>Fair</option>
                            <option value="poor" {% if product.condition == 'poor' %}selected{% endif %}>Poor</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: var(--space-8);">
                    <label for="description" class="form-label">Description <span style="color: var(--danger);">*</span></label>
                    <textarea id="description" name="description" class="form-input" rows="5" required>{{ product.description }}</textarea>
                </div>


                <!-- Pricing & Exchange -->
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-5); margin-bottom: var(--space-5);">
                    <div class="form-group">
                        <label for="price" class="form-label">Price (₹)</label>
                        <input type="number" id="price" name="price" class="form-input" value="{{ product.price if product.price else '' }}" min="0" step="0.01">
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; justify-content: center;">
                        <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer;">
                            <input type="checkbox" id="is_exchangeable" name="is_exchangeable" style="width: 18px; height: 18px; accent-color: var(--primary);" {% if product.is_exchangeable %}checked{% endif %}>
                            <span style="font-weight: var(--weight-medium);">Open to Exchange?</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="exchange_preferences_group" style="margin-bottom: var(--space-8); display: {% if product.is_exchangeable %}block{% else %}none{% endif %};">
                    <label for="exchange_preferences" class="form-label">What are you looking to exchange for?</label>
                    <input type="text" id="exchange_preferences" name="exchange_preferences" class="form-input" value="{{ product.exchange_preferences or '' }}">
                </div>

                <div style="display: flex; gap: var(--space-4); justify-content: flex-end;">
                    <a href="{{ url_for('product.detail', product_id=product.id) }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="save" style="width:18px;height:18px"></i>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const isExchangeable = document.getElementById('is_exchangeable');
    const exchangePrefsGroup = document.getElementById('exchange_preferences_group');

    isExchangeable.addEventListener('change', function() {
        if (this.checked) {
            exchangePrefsGroup.style.display = 'block';
        } else {
            exchangePrefsGroup.style.display = 'none';
        }
    });
</script>
{% endblock %}
