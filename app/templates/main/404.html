{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<section class="section" style="padding-top: calc(var(--navbar-height) + var(--space-12)); text-align: center; min-height: 60vh; display: flex; align-items: center;">
    <div class="container">
        <div style="font-size: 100px; margin-bottom: var(--space-4); animation: float 4s ease-in-out infinite;">🗺️</div>
        <h1 style="font-size: var(--text-4xl); font-weight: var(--weight-extrabold); margin-bottom: var(--space-4);">
            Lost on Campus?
        </h1>
        <p style="font-size: var(--text-lg); color: var(--text-secondary); margin-bottom: var(--space-8); max-width: 480px; margin-left: auto; margin-right: auto;">
            The page you're looking for doesn't exist or has been moved.
            Let's get you back to the marketplace.
        </p>
        <div style="display: flex; gap: var(--space-4); justify-content: center;">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
                <i data-lucide="home" style="width:18px;height:18px"></i>
                Back to Home
            </a>
            <a href="#" class="btn btn-secondary btn-lg">
                <i data-lucide="compass" style="width:18px;height:18px"></i>
                Explore
            </a>
        </div>
    </div>
</section>
{% endblock %}
